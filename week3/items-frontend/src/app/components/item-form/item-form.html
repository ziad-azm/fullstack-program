<section class="item-form">
  <header class="item-form__header">
    <h1>New item</h1>
    <a routerLink="/">← Back to list</a>
  </header>

  <form [formGroup]="form" (ngSubmit)="onSubmit()">
    <div class="field">
      <label for="name">Name</label>
      <input id="name" type="text" formControlName="name" />
      @if (name.invalid && name.touched) {
        <p class="field-error">Name is required</p>
      }
    </div>

    <div class="field">
      <label for="price">Price</label>
      <input id="price" type="number" step="0.01" formControlName="price" />
      @if (price.invalid && price.touched) {
        @if (price.errors?.['required']) {
          <p class="field-error">Price is required</p>
        } @else if (price.errors?.['min']) {
          <p class="field-error">Price must be greater than 0</p>
        }
      }
    </div>

    <div class="field field--checkbox">
      <label>
        <input type="checkbox" formControlName="in_stock" />
        In stock
      </label>
    </div>

    @if (error()) {
      <p class="state state--error">{{ error() }}</p>
    }

    <button type="submit" [disabled]="form.invalid || submitting()">
      {{ submitting() ? 'Creating…' : 'Create item' }}
    </button>
  </form>
</section>
